version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - modernize
    - nolintlint
    - revive
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    misspell:
      locale: US
    testifylint:
      enable-all: true

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jordanbyron/agent-inbox
